name: Publish U1FA 2.0.13

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-2.0.13.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0665bb66e15b2b0fa53b857bdba04526a8e3add5
          fetch-depth: 0
      - id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - run: bash packaging/source/build_source_archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests
      - env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - run: python -m unittest discover -s tests
      - shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests
      - run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [prepare, source, macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - run: |
          set -euo pipefail
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Publish v2.0.13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.0.13 release-assets/*             --repo "${{ github.repository }}"             --target "${{ needs.prepare.outputs.release_sha }}"             --title "U1 Filament Automation 2.0.13"             --notes "## U1FA 2.0.13 — ASA/ABS U1 0.4 profile discovery hotfix

          - Fixes the false ambiguity warning when Snapmaker Orca contains ASA/ABS U1 presets for multiple nozzle sizes.
          - Snapmaker ASA @U1 0.4 nozzle and Snapmaker ABS @U1 0.4 nozzle are now treated as exact local aliases for U1FA's 0.4 mm target.
          - 0.2 / 0.6 / 0.8 nozzle presets are not accepted as exact equivalents.
          - No changes to MVF, temperatures, Adaptive PA, Spoolman, existing calibrated profiles, firmware compatibility or PAXX support."

  cleanup:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean Actions artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do
              [[ -z "$id" ]] || gh api --method DELETE "/repos/$repo/actions/artifacts/$id"
            done
          gh cache delete --all --repo "$repo" || true
      - name: Remove temporary release workflow and branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-2.0.13.yml
          git commit -m "Clean up U1FA 2.0.13 release workflow"
          git push origin HEAD:main
          git push origin --delete hotfix/2.0.13-asa-abs-u1-04-discovery || true
