name: Publish U1FA 1.8.3 one-time

on:
  push:
    branches:
      - release/1.8.3-prep
    paths:
      - ".github/workflows/publish-183-once.yml"

permissions:
  contents: read

env:
  VERSION: "1.8.3"
  TAG: "v1.8.3"
  PUBLIC_RELEASE_REPOSITORY: "ubaccu/u1-filament-automation"
  PUBLIC_SOURCE_BRANCH: "release-source-current"

jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and notes
        run: |
          python - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          assert project["project"]["version"] == "1.8.3"
          assert pathlib.Path("RELEASE_NOTES_1.8.3.md").is_file()
          PY
      - name: Run tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests
      - name: Build corresponding source
        run: packaging/source/build_source_archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/U1-Filament-Automation-v1.8.3-Source.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/U1-Filament-Automation-v1.8.3-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/U1-Filament-Automation-v1.8.3-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/U1-Filament-Automation-v1.8.3-Linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [source, macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate release set and checksums
        run: |
          set -euo pipefail
          test -f release-assets/U1-Filament-Automation-v1.8.3-macOS-x86_64.dmg
          test -f release-assets/U1-Filament-Automation-v1.8.3-macOS-arm64.dmg
          test -f release-assets/U1-Filament-Automation-v1.8.3-Windows-x64-Setup.exe
          test -f release-assets/U1-Filament-Automation-v1.8.3-Linux-x86_64.AppImage
          test -f release-assets/U1-Filament-Automation-v1.8.3-Source.zip
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish exact source snapshot and stable release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PUBLIC_RELEASE_TOKEN is not configured." >&2
            exit 1
          fi
          resolved="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY" --jq .full_name)"
          test "$resolved" = "$PUBLIC_RELEASE_REPOSITORY"

          if gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh api "repos/$PUBLIC_RELEASE_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to retarget." >&2
            exit 1
          fi

          gh auth setup-git
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          mkdir -p "$snapshot_dir/unpacked" "$snapshot_dir/repo"
          unzip -q release-assets/U1-Filament-Automation-v1.8.3-Source.zip -d "$snapshot_dir/unpacked"
          mapfile -t roots < <(find "$snapshot_dir/unpacked" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1
          cp -a "${roots[0]}/." "$snapshot_dir/repo/"

          git -C "$snapshot_dir/repo" init -q
          git -C "$snapshot_dir/repo" checkout --orphan "$PUBLIC_SOURCE_BRANCH" >/dev/null 2>&1
          git -C "$snapshot_dir/repo" config user.name "Bottega3DLab Release"
          git -C "$snapshot_dir/repo" config user.email "riccelliivan@gmail.com"
          git -C "$snapshot_dir/repo" add -A
          git -C "$snapshot_dir/repo" commit -q -m "U1FA $VERSION source snapshot"
          source_commit="$(git -C "$snapshot_dir/repo" rev-parse HEAD)"
          git -C "$snapshot_dir/repo" remote add origin "https://github.com/$PUBLIC_RELEASE_REPOSITORY.git"

          git -C "$snapshot_dir/repo" push --force origin HEAD:"refs/heads/$PUBLIC_SOURCE_BRANCH"
          git -C "$snapshot_dir/repo" tag "$TAG" "$source_commit"
          git -C "$snapshot_dir/repo" push origin "refs/tags/$TAG"

          flags=()
          gh release create "$TAG" release-assets/* \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --title "U1 Filament Automation 1.8.3" \
            --notes-file RELEASE_NOTES_1.8.3.md \
            "${flags[@]}"

          release_tag_sha="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$release_tag_sha" = "$source_commit"
          gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" --json tagName,name,isPrerelease,url

          git -C "$snapshot_dir/repo" push origin --delete "$PUBLIC_SOURCE_BRANCH"
          if git -C "$snapshot_dir/repo" ls-remote --exit-code --heads origin "refs/heads/$PUBLIC_SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "Temporary public source branch still exists after cleanup." >&2
            exit 1
          fi
