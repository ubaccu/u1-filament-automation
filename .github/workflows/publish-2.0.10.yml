name: Publish U1FA 2.0.10

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-2.0.10.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9053d931e38b6357c8c33bf79d50bf103e418ba2
          fetch-depth: 0
      - id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - run: bash packaging/source/build_source_archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests
      - env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - run: python -m unittest discover -s tests
      - shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests
      - run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [prepare, source, macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - run: |
          set -euo pipefail
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Publish v2.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.0.10 release-assets/*             --repo "${{ github.repository }}"             --target "${{ needs.prepare.outputs.release_sha }}"             --title "U1 Filament Automation 2.0.10"             --notes "## U1FA 2.0.10 — ASA & ABS filament support

          - Added ASA and ABS to the spool creation workflow.
          - ASA routes to the official Snapmaker ASA @U1 profile.
          - ABS routes to the official Snapmaker ABS @U1 profile.
          - Spoolman keeps canonical ASA / ABS runtime materials.
          - Official Orca filament_type values are preserved.
          - Official U1 bases currently provide an 8 mm³/s volumetric-flow baseline.
          - Initial UI values: density 1.04 g/cm³, nozzle 255 °C, bed 110 °C; users can adjust them to the real filament datasheet.
          - Adaptive PA keeps the normal K sweep for ASA/ABS; TPU/PEBA remain on the wider dedicated range.
          - No changes to firmware compatibility, PAXX support, existing profiles, or calibrated PA/flow values."

  cleanup:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean Actions artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do
              [[ -z "$id" ]] || gh api --method DELETE "/repos/$repo/actions/artifacts/$id"
            done
          gh cache delete --all --repo "$repo" || true
      - name: Remove temporary release workflow and branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-2.0.10.yml
          git commit -m "Clean up U1FA 2.0.10 release workflow"
          git push origin HEAD:main
          git push origin --delete feature/2.0.10-asa-abs || true
