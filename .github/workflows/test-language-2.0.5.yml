name: Test U1FA 2.0.5 Language Fix

on:
  push:
    branches:
      - fix/2.0.5-language-translation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime test dependency
        run: python -m pip install certifi
      - name: Compile Python sources
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests
      - name: Run complete unit test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
