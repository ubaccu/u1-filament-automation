name: Publish U1FA 2.0.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-2.0.2.yml"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: bash packaging/source/build_source_archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download AppImageKit
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs:
      - source
      - macos
      - windows
      - linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_intel=(release-assets/*macOS-x86_64.dmg)
          mac_arm=(release-assets/*macOS-arm64.dmg)
          windows=(release-assets/*Windows-x64-Setup.exe)
          linux=(release-assets/*Linux-x86_64.AppImage)
          source=(release-assets/*-Source.zip)
          for group in mac_intel mac_arm windows linux source; do
            eval 'count=${#'"$group"'[@]}'
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one $group asset, found $count" >&2
              exit 1
            fi
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish v2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v2.0.2 already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create v2.0.2 release-assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "U1 Filament Automation 2.0.2" \
            --notes-file RELEASE_NOTES_2.0.2.md
