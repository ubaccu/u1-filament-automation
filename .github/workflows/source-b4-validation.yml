name: Source 1.8.3b4 validation

on:
  push:
    branches:
      - feature/1.8.3b4-standard-orca-profiles

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive
        run: bash packaging/source/build_source_archive.sh dist
      - name: Validate 1.8.3b4 source archive
        run: |
          python - <<'PY'
          import pathlib, zipfile

          archives = list(pathlib.Path("dist").glob("*-Source.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one source archive, found {archives}")
          archive = archives[0]
          if "v1.8.3b4-Source.zip" not in archive.name:
              raise SystemExit(f"Unexpected archive name: {archive.name}")

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              required = (
                  "/pyproject.toml",
                  "/src/u1_filament_automation/gui.py",
                  "/src/u1_filament_automation/standard_orca.py",
                  "/src/u1_filament_automation/calibration_batch.py",
                  "/src/u1_filament_automation/assets/flow_calibrator_205_candidate.py",
                  "/src/u1_filament_automation/assets/adaptive_pa_macro_205.cfg",
                  "/packaging/windows/build_installer.ps1",
                  "/packaging/macos/build_dmg.sh",
                  "/packaging/linux/build_appimage.sh",
                  "/SOURCE_RELEASE_INFO.txt",
              )
              for suffix in required:
                  if not any(name.endswith(suffix) for name in names):
                      raise SystemExit(f"Missing source item: {suffix}")
              forbidden = ("/.github/", "/tests/", "/RELEASE_NOTES_")
              for name in names:
                  if any(part in name for part in forbidden):
                      raise SystemExit(f"Development-only file leaked: {name}")
          print(f"Validated {archive} with {len(names)} entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.3b4-Source-validation
          path: dist/*-Source.zip
          if-no-files-found: error
