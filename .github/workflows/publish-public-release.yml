name: Publish public U1FA release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publish-public-release.yml"
      - "packaging/source/build_source_archive.sh"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact pyproject version to build, e.g. 1.8.0b21 or 1.8.0"
        required: true
        type: string
      mode:
        description: "Dry-run builds everything without touching the public repo"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirm:
        description: "For publish mode only: type PUBLISH"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}-${{ inputs.version || 'pr-check' }}
  cancel-in-progress: false

env:
  PUBLIC_RELEASE_REPOSITORY: ubaccu/u1-filament-automation

jobs:
  source-package-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build corresponding-source archive
        run: bash packaging/source/build_source_archive.sh dist
      - name: Validate public source package boundary
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          archives = list(pathlib.Path("dist").glob("*-Source.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one source archive, found {archives}")
          archive = archives[0]
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()

          required_suffixes = (
              "/pyproject.toml",
              "/LICENSE",
              "/THIRD_PARTY_NOTICES.md",
              "/src/u1_filament_automation/gui.py",
              "/packaging/macos/build_dmg.sh",
              "/packaging/windows/build_installer.ps1",
              "/packaging/linux/build_appimage.sh",
              "/vendor/apa-chain-v6-safe/flow_calibrator.py",
              "/SOURCE_RELEASE_INFO.txt",
          )
          for suffix in required_suffixes:
              if not any(name.endswith(suffix) for name in names):
                  raise SystemExit(f"Missing required source-release item: {suffix}")

          forbidden_parts = ("/.github/", "/tests/", "/RELEASE_NOTES_")
          for name in names:
              if any(part in name for part in forbidden_parts):
                  raise SystemExit(f"Development-only file leaked into source archive: {name}")

          print(f"Validated {archive} with {len(names)} entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  validate-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes_file: ${{ steps.meta.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release request
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Public releases may only be dispatched from private main." >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" == "publish" && "$CONFIRMATION" != "PUBLISH" ]]; then
            echo "Publish mode requires exact confirmation: PUBLISH" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          requested = os.environ["REQUESTED_VERSION"].strip()
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          actual = project["project"]["version"]
          if requested != actual:
              raise SystemExit(f"Requested version {requested!r} does not match pyproject {actual!r}")

          match = re.fullmatch(r"(\d+\.\d+\.\d+)(a|b|rc)(\d+)", actual)
          if match:
              base, kind, number = match.groups()
              label = {"a": "alpha", "b": "beta", "rc": "rc"}[kind]
              tag = f"v{base}-{label}.{number}"
              prerelease = "true"
          else:
              tag = f"v{actual}"
              prerelease = "false"

          notes = pathlib.Path(f"RELEASE_NOTES_{actual}.md")
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={actual}", file=output)
              print(f"tag={tag}", file=output)
              print(f"prerelease={prerelease}", file=output)
              print(f"notes_file={notes.as_posix()}", file=output)
          print(f"Validated release {actual} -> {tag}")
          PY

  macos:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build self-contained app and DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build Windows x64 installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download official AppImageKit tool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          sha256sum "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build Linux x86_64 AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    needs:
      - validate-release
      - source-package-check
      - macos
      - windows
      - linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete release set
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          shopt -s nullglob
          mac_intel=(release-assets/*macOS-x86_64.dmg)
          mac_arm=(release-assets/*macOS-arm64.dmg)
          windows=(release-assets/*Windows-x64-Setup.exe)
          linux=(release-assets/*Linux-x86_64.AppImage)
          source=(release-assets/*-Source.zip)
          for group in mac_intel mac_arm windows linux source; do
            eval 'count=${#'"$group"'[@]}'
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one $group asset, found $count" >&2
              exit 1
            fi
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish only to public release repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          NOTES_FILE: ${{ needs.validate-release.outputs.notes_file }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PUBLIC_RELEASE_TOKEN is not configured." >&2
            exit 1
          fi
          resolved="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY" --jq .full_name)"
          if [[ "$resolved" != "$PUBLIC_RELEASE_REPOSITORY" ]]; then
            echo "Release token resolved unexpected repository: $resolved" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Public release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" release-assets/* \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --target main \
            --title "U1 Filament Automation ${TAG#v}" \
            --notes-file "$NOTES_FILE" \
            "${flags[@]}"

          gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" --json tagName,name,isPrerelease,url
