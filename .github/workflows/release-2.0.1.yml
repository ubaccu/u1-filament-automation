name: Build and publish U1FA 2.0.1

on:
  push:
    branches:
      - hotfix/2.0.1-windows-assets-spoolman-ssl

permissions:
  contents: write

concurrency:
  group: u1fa-2.0.1-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact release version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if version != "2.0.1":
              raise SystemExit(f"Expected 2.0.1, found {version}")
          import re
          init_text = pathlib.Path("src/u1_filament_automation/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if not match or match.group(1) != "2.0.1":
              raise SystemExit(f"Package version mismatch: {match.group(1) if match else 'missing'}")
          print("Release version 2.0.1: PASS")
          PY
      - name: Install package
        run: python -m pip install .
      - name: Compile package
        run: python -m compileall -q src/u1_filament_automation
      - name: Full unit and regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate protected source assets
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "flow_calibrator_stock.py": "dcbc26d5c726eb464b8e2a31d2856a816f3170bbda1ed5facb57fb19a816e894",
              "flow_calibrator_v6.py": "74ff744304657547e513fe74c3d42beb55f35eebd4d8f3e0749f0c7febc089ce",
              "flow_calibrator_stock_205.py": "c8e9576a2ce891877c8bc8b216ca80790b12b89d92a703c3c0a2a4c6e7e4ebfa",
              "flow_calibrator_205_candidate.py": "6225503bb6a5aa5bf1680160b590efc0904bf44da01ed8c3eaf84d3ab649a47b",
              "adaptive_pa_macro.cfg": "db181aa5ee12b93886230a6b71cfd105c92a56cf4651e5e5dca7788aac7daeb4",
              "adaptive_pa_macro_205.cfg": "a1e8ec08e0f07f8cb264b60bc10960e38ae6e40560fd46749e93cd0474f150a7",
          }
          root = Path("src/u1_filament_automation/assets")
          for name, wanted in expected.items():
              data = (root / name).read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert b"\r\n" not in data, f"{name}: contains CRLF"
              assert got == wanted, f"{name}: {got} != {wanted}"
              print(name, got)
          PY
      - name: Spoolman HTTPS CA smoke test
        run: |
          python - <<'PY'
          from u1_filament_automation.spoolman import request_json
          data = request_json("https://api.github.com/repos/ubaccu/u1-filament-automation", timeout=15)
          assert data["full_name"] == "ubaccu/u1-filament-automation"
          print("Spoolman HTTPS CA smoke test: PASS")
          PY
      - name: Verify updater path
        run: |
          python - <<'PY'
          from u1_filament_automation.update import is_newer_version
          assert is_newer_version("2.0.1", "2.0.0")
          assert is_newer_version("2.0.1", "1.8.4")
          print("Updater path to 2.0.1: PASS")
          PY

  source:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build corresponding source archive
        run: bash packaging/source/build_source_archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Build DMG and run frozen self-test
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build Windows x64 installer and run frozen self-test
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - name: Verify protected assets inside frozen Windows app
        shell: pwsh
        run: |
          @'
          import hashlib
          from pathlib import Path
          root = Path("dist") / "U1 Filament Automation"
          expected = {
              "flow_calibrator_stock.py": "dcbc26d5c726eb464b8e2a31d2856a816f3170bbda1ed5facb57fb19a816e894",
              "flow_calibrator_v6.py": "74ff744304657547e513fe74c3d42beb55f35eebd4d8f3e0749f0c7febc089ce",
              "flow_calibrator_stock_205.py": "c8e9576a2ce891877c8bc8b216ca80790b12b89d92a703c3c0a2a4c6e7e4ebfa",
              "flow_calibrator_205_candidate.py": "6225503bb6a5aa5bf1680160b590efc0904bf44da01ed8c3eaf84d3ab649a47b",
              "adaptive_pa_macro.cfg": "db181aa5ee12b93886230a6b71cfd105c92a56cf4651e5e5dca7788aac7daeb4",
              "adaptive_pa_macro_205.cfg": "a1e8ec08e0f07f8cb264b60bc10960e38ae6e40560fd46749e93cd0474f150a7",
          }
          for name, wanted in expected.items():
              matches = list(root.rglob(name))
              assert len(matches) == 1, f"{name}: expected one packaged file, found {matches}"
              data = matches[0].read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert b"\r\n" not in data, f"{name}: packaged Windows asset contains CRLF"
              assert got == wanted, f"{name}: packaged hash {got} != {wanted}"
              print(matches[0], got)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Download AppImageKit
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build Linux AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [validate, source, macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_intel=(release-assets/*macOS-x86_64.dmg)
          mac_arm=(release-assets/*macOS-arm64.dmg)
          windows=(release-assets/*Windows-x64-Setup.exe)
          linux=(release-assets/*Linux-x86_64.AppImage)
          source=(release-assets/*-Source.zip)
          for group in mac_intel mac_arm windows linux source; do
            eval 'count=${#'"$group"'[@]}'
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one $group asset, found $count" >&2
              exit 1
            fi
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v2.0.1 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create v2.0.1 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "U1 Filament Automation 2.0.1" \
            --notes-file RELEASE_NOTES_2.0.1.md
