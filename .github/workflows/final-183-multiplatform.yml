name: U1FA 1.8.3 final multiplatform validation

on:
  push:
    branches:
      - release/1.8.3-prep
    paths:
      - ".github/workflows/final-183-multiplatform.yml"

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - name: Verify version
        run: |
          test -f "dist/U1-Filament-Automation-v1.8.3-macOS-${{ matrix.arch }}.dmg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/U1 Filament Automation.app/Contents/Info.plist')" = "1.8.3"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/U1-Filament-Automation-v1.8.3-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\U1-Filament-Automation-v1.8.3-Windows-x64-Setup.exe")) { throw "Installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/U1-Filament-Automation-v1.8.3-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - name: Verify AppImage
        run: test -f dist/U1-Filament-Automation-v1.8.3-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/U1-Filament-Automation-v1.8.3-Linux-x86_64.AppImage
          if-no-files-found: error

  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build GPL source archive
        run: packaging/source/build_source_archive.sh
      - name: Verify source archive
        run: test -f dist/U1-Filament-Automation-v1.8.3-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/U1-Filament-Automation-v1.8.3-Source.zip
          if-no-files-found: error

  release-bundle:
    needs: [macos, windows, linux, source]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle
          merge-multiple: true
      - name: Create SHA256SUMS
        run: |
          cd bundle
          sha256sum             U1-Filament-Automation-v1.8.3-macOS-x86_64.dmg             U1-Filament-Automation-v1.8.3-macOS-arm64.dmg             U1-Filament-Automation-v1.8.3-Windows-x64-Setup.exe             U1-Filament-Automation-v1.8.3-Linux-x86_64.AppImage             U1-Filament-Automation-v1.8.3-Source.zip             > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.3-final-release-bundle
          path: bundle/
          if-no-files-found: error
