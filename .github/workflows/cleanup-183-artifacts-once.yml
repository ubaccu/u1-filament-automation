name: Cleanup U1FA 1.8.3 temporary artifacts once

on:
  push:
    branches:
      - release/1.8.3-prep
    paths:
      - ".github/workflows/cleanup-183-artifacts-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: Remove temporary validation and publication artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=(
            36232960141
            36235722858
            36242537166
            36244085533
            36244110933
          )
          deleted=0
          for run_id in "${runs[@]}"; do
            echo "Checking run $run_id"
            mapfile -t ids < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"                 --jq '.artifacts[].id'
            )
            for artifact_id in "${ids[@]}"; do
              echo "Deleting artifact $artifact_id from run $run_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted $deleted temporary artifact(s)."
