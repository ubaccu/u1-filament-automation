name: Windows beta validation

on:
  push:
    branches:
      - feature/1.8.3b3-orca-batch-foundation

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify protected assets
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          python -m unittest discover -s tests
      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          packaging/windows/build_installer.ps1
      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.3b3-Windows-validation
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error
