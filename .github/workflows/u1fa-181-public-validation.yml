name: U1FA 1.8.1 public validation

on:
  push:
    branches:
      - dev/1.8.1-final
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/u1fa-181-public-validation.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python 3.12
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run full test suite
        run: python -m unittest discover -s tests

  macos:
    name: macOS / ${{ matrix.arch }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - name: Checksums
        run: shasum -a 256 dist/*.dmg
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.1-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows / x64
    needs: tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - name: SHA256
        shell: pwsh
        run: Get-FileHash dist/*Windows-x64-Setup.exe -Algorithm SHA256
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.1-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux / x86_64
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download AppImageKit
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          sha256sum "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - name: SHA256
        run: sha256sum dist/*.AppImage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.1-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  source:
    name: Source archive
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive
        run: packaging/source/build_source_archive.sh
      - name: Validate archive
        run: |
          unzip -l dist/*Source.zip | head -n 40
          sha256sum dist/*Source.zip
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.1-source
          path: dist/*Source.zip
          if-no-files-found: error
          retention-days: 1
