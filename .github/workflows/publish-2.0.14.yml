name: Publish verified U1FA 2.0.14 packages
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-2.0.14.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that sources match the tested build
        run: |
          git fetch origin 2a29ff438d2df122115217a0a761eacf4cc0d343
          git diff --exit-code 2a29ff438d2df122115217a0a761eacf4cc0d343 HEAD -- . ':!.github/workflows'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45394413246
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Verify package set and publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(*)
          [[ ${#files[@]} == 5 ]]
          for suffix in 'Linux-x86_64.AppImage' 'macOS-arm64.dmg' 'macOS-x86_64.dmg' 'Source.zip' 'Windows-x64-Setup.exe'; do
            matches=( *"$suffix" )
            test -s "${matches[0]}"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release create v2.0.14 "${files[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "U1 Filament Automation 2.0.14" --notes "Transfer your existing U1FA filament profiles from Snapmaker Orca to OrcaSlicer, including inherited settings and saved Adaptive PA models. Choose Manage Orca Slicer profiles and enable the mirror. New spools also receive an OrcaSlicer profile immediately. Spooler linking is optional."
