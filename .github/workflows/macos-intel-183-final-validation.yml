name: macOS Intel 1.8.3 final validation

on:
  push:
    branches:
      - release/1.8.3-prep
    paths:
      - ".github/workflows/macos-intel-183-final-validation.yml"

permissions:
  contents: read

jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install . pyinstaller
          python -m unittest discover -s tests
      - name: Verify final version and firmware fingerprint
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import u1_filament_automation as pkg
          from u1_filament_automation.firmware_compatibility import ADAPTIVE_205_PRINT_TASK_CONFIG
          from u1_filament_automation import gui_182_final_ui as ui
          assert pkg.__version__ == "1.8.3", pkg.__version__
          assert ADAPTIVE_205_PRINT_TASK_CONFIG == "3770801d859dcc33cd12eaf5bff775973df46d79cd70622e26b46bd029714d4a"
          assert "v1.8.3" in ui._sidebar("it")
          assert "U1FA 1.8.3" in ui._hero("it")
          PY
      - name: Build Intel DMG
        env:
          U1FA_ARCH: x86_64
        run: packaging/macos/build_dmg.sh
      - name: Verify bundle and DMG
        run: |
          APP="dist/U1 Filament Automation.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "1.8.3"
          test -f "dist/U1-Filament-Automation-v1.8.3-macOS-x86_64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-1.8.3-macOS-x86_64-final-validation
          path: dist/U1-Filament-Automation-v1.8.3-macOS-x86_64.dmg
          if-no-files-found: error
