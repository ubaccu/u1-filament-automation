name: Publish U1FA 2.0.6

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-2.0.6.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update changelog for 2.0.6
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          heading = "## 2.0.6 — filament picker language hotfix"
          if heading not in text:
              section = """## 2.0.6 — filament picker language hotfix

          - Corretto il campo di ricerca del selettore filamenti della calibrazione: con **IT** mostra solo **“Cerca filamento…”**, con **EN** solo **“Search filament…”**.
          - Corretto anche il messaggio quando la ricerca non trova risultati: **“Nessun filamento trovato”** in IT e **“No filament found”** in EN.
          - Restano invariati l'ordinamento alfabetico A → Z e la visualizzazione dei colori Spoolman introdotti nella 2.0.5.
          - Nessuna modifica ad Adaptive PA, profili Orca, logica di scrittura Spoolman, compatibilità firmware o supporto PAXX.

          """
              prefix = "# Changelog\n\n"
              if not text.startswith(prefix):
                  raise SystemExit("Unexpected CHANGELOG.md header")
              path.write_text(prefix + section + text[len(prefix):], encoding="utf-8")
          PY
      - name: Commit changelog if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains 2.0.6"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Document U1FA 2.0.6 release"
            git push origin HEAD:main
          fi
      - name: Capture release commit
        id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Build source archive
        run: bash packaging/source/build_source_archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download AppImageKit
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - source
      - macos
      - windows
      - linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_intel=(release-assets/*macOS-x86_64.dmg)
          mac_arm=(release-assets/*macOS-arm64.dmg)
          windows=(release-assets/*Windows-x64-Setup.exe)
          linux=(release-assets/*Linux-x86_64.AppImage)
          source=(release-assets/*-Source.zip)
          for group in mac_intel mac_arm windows linux source; do
            eval 'count=${#'"$group"'[@]}'
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one $group asset, found $count" >&2
              exit 1
            fi
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Publish v2.0.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v2.0.6 already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create v2.0.6 release-assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.release_sha }}" \
            --title "U1 Filament Automation 2.0.6" \
            --notes-file RELEASE_NOTES_2.0.6.md

  cleanup:
    needs:
      - publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary 2.0.6 workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-2.0.6.yml .github/workflows/test-2.0.6.yml
          git commit -m "Clean up U1FA 2.0.6 release workflows"
          git push origin HEAD:main
