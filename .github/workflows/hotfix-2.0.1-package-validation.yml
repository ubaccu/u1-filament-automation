name: Hotfix 2.0.1 package validation

on:
  push:
    branches:
      - hotfix/2.0.1-windows-assets-spoolman-ssl
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u1fa-2.0.1-package-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install .
      - name: Compile package
        run: python -m compileall -q src/u1_filament_automation
      - name: Full unit/regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate protected source assets
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "flow_calibrator_stock.py": "dcbc26d5c726eb464b8e2a31d2856a816f3170bbda1ed5facb57fb19a816e894",
              "flow_calibrator_v6.py": "74ff744304657547e513fe74c3d42beb55f35eebd4d8f3e0749f0c7febc089ce",
              "flow_calibrator_stock_205.py": "c8e9576a2ce891877c8bc8b216ca80790b12b89d92a703c3c0a2a4c6e7e4ebfa",
              "flow_calibrator_205_candidate.py": "6225503bb6a5aa5bf1680160b590efc0904bf44da01ed8c3eaf84d3ab649a47b",
              "adaptive_pa_macro.cfg": "db181aa5ee12b93886230a6b71cfd105c92a56cf4651e5e5dca7788aac7daeb4",
              "adaptive_pa_macro_205.cfg": "a1e8ec08e0f07f8cb264b60bc10960e38ae6e40560fd46749e93cd0474f150a7",
          }
          root = Path("src/u1_filament_automation/assets")
          for name, wanted in expected.items():
              data = (root / name).read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert b"\r\n" not in data, f"{name}: source contains CRLF"
              assert got == wanted, f"{name}: {got} != {wanted}"
              print(name, got)
          PY
      - name: HTTPS smoke test with bundled CA trust
        run: |
          python - <<'PY'
          from u1_filament_automation.spoolman import request_json
          data = request_json("https://api.github.com/repos/ubaccu/u1-filament-automation", timeout=15)
          assert data["full_name"] == "ubaccu/u1-filament-automation"
          print("HTTPS CA smoke test: PASS")
          PY

  windows-package:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build Windows installer and run frozen self-test
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - name: Verify exact protected assets inside frozen Windows app
        shell: pwsh
        run: |
          @'
          import hashlib
          from pathlib import Path

          root = Path("dist") / "U1 Filament Automation"
          expected = {
              "flow_calibrator_stock.py": "dcbc26d5c726eb464b8e2a31d2856a816f3170bbda1ed5facb57fb19a816e894",
              "flow_calibrator_v6.py": "74ff744304657547e513fe74c3d42beb55f35eebd4d8f3e0749f0c7febc089ce",
              "flow_calibrator_stock_205.py": "c8e9576a2ce891877c8bc8b216ca80790b12b89d92a703c3c0a2a4c6e7e4ebfa",
              "flow_calibrator_205_candidate.py": "6225503bb6a5aa5bf1680160b590efc0904bf44da01ed8c3eaf84d3ab649a47b",
              "adaptive_pa_macro.cfg": "db181aa5ee12b93886230a6b71cfd105c92a56cf4651e5e5dca7788aac7daeb4",
              "adaptive_pa_macro_205.cfg": "a1e8ec08e0f07f8cb264b60bc10960e38ae6e40560fd46749e93cd0474f150a7",
          }
          for name, wanted in expected.items():
              matches = list(root.rglob(name))
              assert len(matches) == 1, f"{name}: expected one packaged file, found {matches}"
              data = matches[0].read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert b"\r\n" not in data, f"{name}: packaged Windows asset contains CRLF"
              assert got == wanted, f"{name}: packaged hash {got} != {wanted}"
              print(matches[0], got)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-2.0.1-hotfix-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 3

  linux-package:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Download AppImageKit
        run: |
          curl --fail --location --retry 3             --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage"             https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build Linux AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh

  macos-package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Build DMG and run frozen self-test
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
