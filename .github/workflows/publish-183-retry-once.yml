name: Publish U1FA 1.8.3 retry once

on:
  push:
    branches:
      - release/1.8.3-prep
    paths:
      - ".github/workflows/publish-183-retry-once.yml"

permissions:
  contents: write
  actions: read

env:
  VERSION: "1.8.3"
  TAG: "v1.8.3"
  PUBLIC_RELEASE_REPOSITORY: "ubaccu/u1-filament-automation"
  PUBLIC_SOURCE_BRANCH: "release-source-current"
  SOURCE_RUN_ID: "36244110933"

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download already validated 1.8.3 assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ubaccu/u1-filament-automation
          run-id: 36244110933
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate release set and checksums
        run: |
          set -euo pipefail
          test -f release-assets/U1-Filament-Automation-v1.8.3-macOS-x86_64.dmg
          test -f release-assets/U1-Filament-Automation-v1.8.3-macOS-arm64.dmg
          test -f release-assets/U1-Filament-Automation-v1.8.3-Windows-x64-Setup.exe
          test -f release-assets/U1-Filament-Automation-v1.8.3-Linux-x86_64.AppImage
          test -f release-assets/U1-Filament-Automation-v1.8.3-Source.zip
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish exact source snapshot and stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY" --jq .full_name)"
          test "$resolved" = "$PUBLIC_RELEASE_REPOSITORY"

          if gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh api "repos/$PUBLIC_RELEASE_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to retarget." >&2
            exit 1
          fi

          gh auth setup-git
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          mkdir -p "$snapshot_dir/unpacked" "$snapshot_dir/repo"
          unzip -q release-assets/U1-Filament-Automation-v1.8.3-Source.zip -d "$snapshot_dir/unpacked"
          mapfile -t roots < <(find "$snapshot_dir/unpacked" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1
          cp -a "${roots[0]}/." "$snapshot_dir/repo/"

          git -C "$snapshot_dir/repo" init -q
          git -C "$snapshot_dir/repo" checkout --orphan "$PUBLIC_SOURCE_BRANCH" >/dev/null 2>&1
          git -C "$snapshot_dir/repo" config user.name "Bottega3DLab Release"
          git -C "$snapshot_dir/repo" config user.email "riccelliivan@gmail.com"
          git -C "$snapshot_dir/repo" add -A
          git -C "$snapshot_dir/repo" commit -q -m "U1FA $VERSION source snapshot"
          source_commit="$(git -C "$snapshot_dir/repo" rev-parse HEAD)"
          git -C "$snapshot_dir/repo" remote add origin "https://github.com/$PUBLIC_RELEASE_REPOSITORY.git"

          git -C "$snapshot_dir/repo" push --force origin HEAD:"refs/heads/$PUBLIC_SOURCE_BRANCH"
          git -C "$snapshot_dir/repo" tag "$TAG" "$source_commit"
          git -C "$snapshot_dir/repo" push origin "refs/tags/$TAG"

          gh release create "$TAG" release-assets/* \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --title "U1 Filament Automation 1.8.3" \
            --notes-file RELEASE_NOTES_1.8.3.md

          release_tag_sha="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$release_tag_sha" = "$source_commit"
          gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" --json tagName,name,isPrerelease,url

          git -C "$snapshot_dir/repo" push origin --delete "$PUBLIC_SOURCE_BRANCH"
          if git -C "$snapshot_dir/repo" ls-remote --exit-code --heads origin "refs/heads/$PUBLIC_SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "Temporary public source branch still exists after cleanup." >&2
            exit 1
          fi
