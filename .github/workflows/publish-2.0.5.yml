name: Polish U1FA 2.0.5 public documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-2.0.5.yml"

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clean public 2.0.5 text
        run: |
          python - <<'PY'
          from pathlib import Path

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          # Release notes: keep only user-facing changes.
          p = Path("RELEASE_NOTES_2.0.5.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "This release fixes the Italian/English language handling throughout the U1FA desktop interface and adds a small usability improvement requested by the community.",
              "This release fixes the Italian/English language handling throughout U1FA and improves the calibration filament picker with alphabetical ordering and Spoolman colour indicators.",
          )
          for line in (
              "- New regression tests cover language persistence, English rendering, technical error translation and the alphabetic/colour-aware filament picker.\n",
              "- RFID support is not part of this release.\n",
              "\nThe complete automated test suite passed before release.\n",
          ):
              text = text.replace(line, "")
          write(str(p), text.rstrip() + "\n")

          # Changelog: remove internal QA/non-feature notes from the public entry.
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "- Aggiunti test di regressione dedicati a persistenza lingua, rendering EN, errori tecnici e selettore alfabetico con colori.\n",
              "",
          )
          text = text.replace("- Il supporto RFID non fa parte di questa release.\n", "")
          write(str(p), text)

          # README EN: update current-release wording and expose the new 2.0.5 UI improvements.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          anchor = "- **Single and multicolour spools** — 2 to 8 HEX colours are preserved in generated Orca profiles.\n"
          additions = (
              "- **Persistent IT/EN interface** — the selected language is remembered after closing and reopening U1FA.\n"
              "- **Alphabetical colour-aware calibration picker** — calibration selectors are ordered A → Z and show the colour information stored in Spoolman.\n"
          )
          if additions not in text:
              text = text.replace(anchor, anchor + additions)
          text = text.replace(
              "**Firmware compatibility:** U1FA 2.0.0 recognizes the current stable PAXX",
              "**Firmware compatibility:** the current U1FA release recognizes the stable PAXX",
          )
          text = text.replace(
              "U1FA 2.0.0 generates filament profiles for the **Snapmaker U1 with a 0.4 mm nozzle**.",
              "U1FA generates filament profiles for the **Snapmaker U1 with a 0.4 mm nozzle**.",
          )
          text = text.replace(
              "are not claimed as supported by U1FA 2.0.0.",
              "are not claimed as supported by U1FA.",
          )
          write(str(p), text)

          # README IT: same cleanup and current 2.0.5 UI improvements.
          p = Path("README.it.md")
          text = p.read_text(encoding="utf-8")
          anchor = "- **Bobine mono e multicolore** — da 2 a 8 colori HEX vengono mantenuti nel profilo Orca generato.\n"
          additions = (
              "- **Interfaccia IT/EN persistente** — la lingua scelta viene ricordata anche dopo la chiusura e il riavvio di U1FA.\n"
              "- **Selettore calibrazione alfabetico con colore** — i profili/bobine sono ordinati A → Z e mostrano le informazioni colore salvate in Spoolman.\n"
          )
          if additions not in text:
              text = text.replace(anchor, anchor + additions)
          text = text.replace(
              "**Compatibilità firmware:** U1FA 2.0.0 riconosce l'attuale PAXX stabile",
              "**Compatibilità firmware:** la release U1FA attuale riconosce il PAXX stabile",
          )
          text = text.replace(
              "U1FA 2.0.0 genera profili filamento per **Snapmaker U1 con ugello 0,4 mm**.",
              "U1FA genera profili filamento per **Snapmaker U1 con ugello 0,4 mm**.",
          )
          text = text.replace(
              "non vengono dichiarati supportati dalla 2.0.0.",
              "non vengono dichiarati supportati da U1FA.",
          )
          write(str(p), text)
          PY

      - name: Update published GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v2.0.5 \
            --repo "${{ github.repository }}" \
            --title "U1 Filament Automation 2.0.5" \
            --notes-file RELEASE_NOTES_2.0.5.md

      - name: Commit documentation cleanup and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-2.0.5.yml
          git add CHANGELOG.md README.md README.it.md RELEASE_NOTES_2.0.5.md
          git commit -m "Polish U1FA 2.0.5 public documentation"
          git push origin HEAD:main
