name: Hotfix 2.0.1 validation

on:
  push:
    branches:
      - hotfix/2.0.1-windows-assets-spoolman-ssl
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependencies
        run: python -m pip install --disable-pip-version-check certifi
      - name: Unit and regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Protected asset hashes must stay canonical LF
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "src/u1_filament_automation/assets/adaptive_pa_macro_205.cfg":
                  "a1e8ec08e0f07f8cb264b60bc10960e38ae6e40560fd46749e93cd0474f150a7",
              "src/u1_filament_automation/assets/flow_calibrator_205_candidate.py":
                  "6225503bb6a5aa5bf1680160b590efc0904bf44da01ed8c3eaf84d3ab649a47b",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert b"\r\n" not in data, f"{name}: CRLF found"
              assert got == wanted, f"{name}: {got} != {wanted}"
              print(name, got)
          PY
