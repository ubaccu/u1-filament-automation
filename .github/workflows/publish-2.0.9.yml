name: Publish U1FA 2.0.9

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-2.0.9.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6be1a8309f7fb1b41f5a88e24b3fb0496af9cad1
          fetch-depth: 0
      - name: Capture release commit
        id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Build source archive
        run: bash packaging/source/build_source_archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Source
          path: dist/*-Source.zip
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build DMG
        env:
          U1FA_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install . pyinstaller pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Windows-x64
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download AppImageKit
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          U1FA_ARCH: x86_64
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: U1FA-Linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - source
      - macos
      - windows
      - linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: U1FA-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_intel=(release-assets/*macOS-x86_64.dmg)
          mac_arm=(release-assets/*macOS-arm64.dmg)
          windows=(release-assets/*Windows-x64-Setup.exe)
          linux=(release-assets/*Linux-x86_64.AppImage)
          source=(release-assets/*-Source.zip)
          for group in mac_intel mac_arm windows linux source; do
            eval 'count=${#'"$group"'[@]}'
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one $group asset, found $count" >&2
              exit 1
            fi
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Publish v2.0.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.9 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v2.0.9 already exists; refusing to overwrite." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## U1FA 2.0.9 — PAXX 12-24 compatibility & Windows OpenSSH fix

          - Added fail-closed support for **PAXX v2.0.0-paxx12-24** on the Snapmaker 2.0.0.205 base.
          - PAXX 12-24 is accepted only when the exact full version and reviewed component SHA-256 fingerprints match; unknown or future PAXX variants remain blocked.
          - Added the validated PAXX 12-24 `print_task_config.py` fingerprint reported by the live read-only check in Issue #26.
          - Fixed first-time Windows OpenSSH connections by using `StrictHostKeyChecking=accept-new`: a new host key can be registered without blocking U1FA, while a changed known key is still rejected.
          - Increased the SSH subprocess timeout margin for Windows `SSH_ASKPASS`.
          - No changes to Adaptive PA algorithms, calibrated PA/flow values, Orca profiles or Spoolman data.
          EOF
          for attempt in 1 2 3; do
            if gh release create v2.0.9 release-assets/* \
              --repo "${{ github.repository }}" \
              --target "${{ needs.prepare.outputs.release_sha }}" \
              --title "U1 Filament Automation 2.0.9" \
              --notes-file "$RUNNER_TEMP/release-notes.md"; then
              exit 0
            fi
            if gh release view v2.0.9 --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release v2.0.9 exists after a transient publish error; continuing."
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to publish v2.0.9 after 3 attempts." >&2
          exit 1

  cleanup:
    needs:
      - publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean Actions artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do
              [[ -z "$id" ]] || gh api --method DELETE "/repos/$repo/actions/artifacts/$id"
            done
          gh cache delete --all --repo "$repo" || true
      - name: Remove release workflow and temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-2.0.9.yml
          git commit -m "Clean up U1FA 2.0.9 release workflow"
          git push origin HEAD:main
          git push origin --delete fix/2.0.9-paxx12-24-ssh || true
